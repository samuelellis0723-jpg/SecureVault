name: SecurityVault CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-rust:
    name: Backend (Rust + PostgreSQL 16 + Supply Chain)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securityvault_owner
          POSTGRES_PASSWORD: ci_owner_password_not_for_prod
          POSTGRES_DB: securityvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U securityvault_owner -d securityvault_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check formatting (cargo fmt)
        working-directory: backend
        run: cargo fmt --check

      - name: Run Clippy (-D warnings)
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit, HTTP, and live PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://securityvault_owner:ci_owner_password_not_for_prod@127.0.0.1:5432/securityvault_test?sslmode=disable
        run: cargo test --locked --all-features

      - name: Verify least-privilege PostgreSQL role (00_least_privilege_role.sql)
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

          CI_APP_PASS="ci_app_least_privilege_2026_ok"
          OWNER_URL="postgresql://securityvault_owner:ci_owner_password_not_for_prod@127.0.0.1:5432/securityvault_test?sslmode=disable"
          APP_URL="postgresql://securityvault_app:${CI_APP_PASS}@127.0.0.1:5432/securityvault_test?sslmode=disable"

          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -f backend/migrations/0001_initial_schema.sql
          sed "s/CAMBIA_ESTA_CONTRASENA_FUERTE/${CI_APP_PASS}/g" backend/sql/00_least_privilege_role.sql \
            | psql "$OWNER_URL" -v ON_ERROR_STOP=1

          # Confirm DML read works as securityvault_app
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM public.users;"

          # Confirm DDL (CREATE TABLE) is denied for securityvault_app
          if psql "$APP_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.hack(x int);"; then
            echo "ERROR: securityvault_app unexpectedly succeeded in CREATE TABLE"
            exit 1
          else
            echo "OK: securityvault_app was denied CREATE TABLE as expected."
          fi

      - name: Audit Rust dependencies (cargo audit)
        working-directory: backend
        run: cargo audit

      - name: Verify Rust supply-chain policy (cargo deny)
        working-directory: backend
        run: cargo deny check

  frontend-react:
    name: Frontend (React + Vite + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run Jest + React Testing Library tests
        run: npm test

      - name: Audit npm dependencies (high+)
        run: npm audit --audit-level=high

      - name: Build production SPA bundle
        run: npm run build

  docker-build-check:
    name: Docker Build & Non-Root User Check
    runs-on: ubuntu-latest
    needs:
      - backend-rust
      - frontend-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t securityvault:ci .

      - name: Verify non-root container user (appuser)
        run: |
          set -euo pipefail
          CONTAINER_USER="$(docker inspect --format='{{.Config.User}}' securityvault:ci)"
          echo "Detected Config.User=${CONTAINER_USER}"
          if [ "$CONTAINER_USER" != "appuser" ]; then
            echo "ERROR: Expected Config.User to be 'appuser', got '${CONTAINER_USER}'"
            exit 1
          fi
